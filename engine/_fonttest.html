<!doctype html><meta charset="utf-8"><style>
@font-face{font-family:'T';src:url('fonts/SourceHanSerifSC-Regular.otf');font-weight:400}
body{margin:0;background:#222}
canvas{display:block}
</style><canvas id="c" width="1200" height="400"></canvas>
<script>
const x=document.getElementById('c').getContext('2d');
document.fonts.load('400 60px "T"','恋爱如酒 刺鼻而青涩 明明很高兴 心里却只剩悲伤').then(()=>{
  x.fillStyle='#000';x.fillRect(0,0,1200,400);
  x.fillStyle='#fff';x.font='400 60px "T"';
  x.fillText('恋爱如酒 刺鼻而青涩',40,100);
  x.fillText('明明很高兴 心里却只剩悲伤',40,200);
  x.fillText('我们的相遇 会是意外吗',40,300);
  document.title='drawn';
});
</script>
